<!--
- Single file SVG animation
- * can be used as CSS backgroud
- * total size is less than 2kb!
- * sunset palette: violet -> pink -> peach/orange
-->

<svg preserveAspectRatio="xMidYMid slice" viewBox="10 10 80 80">
    <defs>
        <style>
            * {
                box-sizing: border-box;
                padding: 0;
                margin: 0;
            }

            svg {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
            }


            .links {
                position: fixed;
                bottom: 20px;
                right: 20px;
                font-size: 18px;
                font-family: sans-serif;
            }

            a {
                text-decoration: none;
                color: black;
                margin-left: 1em;
            }

            a:hover {
                text-decoration: underline;
            }

            a img.icon {
                display: inline-block;
                height: 1em;
                margin: 0 0 -0.1em 0.3em;
            }

            @keyframes rotate {
                0% {
                    transform: scale(1) rotate(0deg);
                }

                100% {
                    transform: scale(1.5) rotate(360deg);
                }
            }

            .out-top {
                animation: rotate 20s linear infinite alternate;
                transform-origin: 13px 25px;
            }

            .in-top {
                animation: rotate 10s linear infinite alternate;
                transform-origin: 13px 25px;
            }

            .out-bottom {
                animation: rotate 25s linear infinite alternate;
                transform-origin: 84px 93px;
            }

            .in-bottom {
                animation: rotate 15s linear infinite alternate;
                transform-origin: 84px 93px;
            }

            /* Orange wavy border that grows in thickness, then reverses. */
            @keyframes growBorder {
                0% {
                    stroke-width: 1;
                }

                100% {
                    stroke-width: 7;
                }
            }
        </style>

        <!-- Vertical sky gradient: violet (top) -> pink -> peach/orange (horizon).
             The gradient vector sways so the bands drift along with the rotating blobs,
             and every stop travels widely through the sunset palette. -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <!-- Sway the gradient direction back and forth, echoing the blob rotation -->
            <animate attributeName="x1" values="0;0.35;0;-0.35;0" dur="20s" repeatCount="indefinite" />
            <animate attributeName="y1" values="0;0.12;0;0.12;0" dur="20s" repeatCount="indefinite" />
            <animate attributeName="x2" values="0;-0.35;0;0.35;0" dur="20s" repeatCount="indefinite" />
            <animate attributeName="y2" values="1;0.88;1;0.88;1" dur="20s" repeatCount="indefinite" />

            <stop offset="0%" stop-color="#7e6fb0">
                <animate attributeName="stop-color"
                    values="#7e6fb0;#6f5fb6;#8a6db1;#a072b0;#9a72b0;#8a6db1;#7e6fb0" dur="18s"
                    repeatCount="indefinite" />
            </stop>
            <stop offset="45%" stop-color="#d488ac">
                <animate attributeName="stop-color"
                    values="#d488ac;#c97aa6;#e294b0;#f0a5bd;#ec9fba;#e294b0;#d488ac" dur="18s"
                    repeatCount="indefinite" />
            </stop>
            <stop offset="78%" stop-color="#f2a08e">
                <animate attributeName="stop-color"
                    values="#f2a08e;#ee9b9c;#f6a07a;#f7b08c;#f59a8e;#f2a08e;#f2a08e" dur="18s"
                    repeatCount="indefinite" />
            </stop>
            <stop offset="100%" stop-color="#fcca7c">
                <animate attributeName="stop-color"
                    values="#fcca7c;#fbbd84;#f9b07c;#f7c089;#fcca7c;#fbbd84;#fcca7c" dur="18s"
                    repeatCount="indefinite" />
            </stop>
        </linearGradient>

        <!-- Deep violet / purple gradient (top of the sunset) -->
        <linearGradient id="violetGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#7e62a8">
                <animate attributeName="stop-color" values="#7e62a8;#8f6aac;#a072b0;#8f6aac;#7e62a8" dur="12s"
                    repeatCount="indefinite" />
            </stop>
            <stop offset="100%" stop-color="#b977a8">
                <animate attributeName="stop-color" values="#b977a8;#c97aa6;#d488ac;#c97aa6;#b977a8" dur="12s"
                    repeatCount="indefinite" />
            </stop>
        </linearGradient>

        <!-- Pink / magenta gradient (mid sky) -->
        <linearGradient id="pinkGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#d97fae">
                <animate attributeName="stop-color" values="#d97fae;#e08aa8;#ec96b4;#e08aa8;#d97fae" dur="9s"
                    repeatCount="indefinite" />
            </stop>
            <stop offset="100%" stop-color="#c97aa6">
                <animate attributeName="stop-color" values="#c97aa6;#e294b0;#f0a5bd;#e294b0;#c97aa6" dur="9s"
                    repeatCount="indefinite" />
            </stop>
        </linearGradient>

        <!-- Rosy pink gradient (warm but still pink horizon) -->
        <linearGradient id="peachGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e893b0">
                <animate attributeName="stop-color" values="#e893b0;#f0a0b6;#f4abbe;#f0a0b6;#e893b0" dur="10s"
                    repeatCount="indefinite" />
            </stop>
            <stop offset="100%" stop-color="#d488ac">
                <animate attributeName="stop-color" values="#d488ac;#e294b0;#ec9fba;#e294b0;#d488ac" dur="10s"
                    repeatCount="indefinite" />
            </stop>
        </linearGradient>
    </defs>

    <!-- Sunset sky background -->
    <rect x="10" y="10" width="80" height="80" fill="url(#skyGrad)" />

    <path fill="url(#violetGrad)" class="out-top"
        d="M37-5C25.1-14.7,5.7-19.1-9.2-10-28.5,1.8-32.7,31.1-19.8,49c15.5,21.5,52.6,22,67.2,2.3C59.4,35,53.7,8.5,37-5Z" />
    <path fill="url(#pinkGrad)" class="in-top"
        d="M20.6,4.1C11.6,1.5-1.9,2.5-8,11.2-16.3,23.1-8.2,45.6,7.4,50S42.1,38.9,41,24.5C40.2,14.1,29.4,6.6,20.6,4.1Z" />
    <path fill="url(#peachGrad)" class="out-bottom"
        d="M105.9,48.6c-12.4-8.2-29.3-4.8-39.4.8-23.4,12.8-37.7,51.9-19.1,74.1s63.9,15.3,76-5.6c7.6-13.3,1.8-31.1-2.3-43.8C117.6,63.3,114.7,54.3,105.9,48.6Z" />
    <path fill="url(#pinkGrad)" class="in-bottom"
        d="M102,67.1c-9.6-6.1-22-3.1-29.5,2-15.4,10.7-19.6,37.5-7.6,47.8s35.9,3.9,44.5-12.5C115.5,92.6,113.9,74.6,102,67.1Z" />
</svg>
