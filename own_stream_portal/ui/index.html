<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0d12">
    <title>Own Stream Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <header data-role="status" class="status is-connecting">
        <span class="status-dot" aria-hidden="true"></span>
        <span data-role="status-text">Conectando…</span>
    </header>

    <nav data-role="tabs" class="tabs" hidden></nav>

    <main data-role="grid" class="grid"></main>

    <div data-role="toast" class="toast" hidden></div>

    <script type="module" src="app.js"></script>
</body>
</html>
