<!--
- Single file SVG animation
- * can be used as CSS backgroud
- * total size is less than 2kb!
- * FIFA World Cup 26 variant -- palette limited to three color families:
-   blue  #82B1FF / #3150F6 / #1D2182
-   green #B0E906 / #01C853 / #004C40
-   red   #FF3B01 / #D60000 / #751312
-   (plus light gray #D1D4D1 for the sky)
-->

<svg preserveAspectRatio="xMidYMid slice" viewBox="10 10 80 80">
    <defs>
        <style>
            * {
                box-sizing: border-box;
                padding: 0;
                margin: 0;
            }

            svg {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
            }


            .links {
                position: fixed;
                bottom: 20px;
                right: 20px;
                font-size: 18px;
                font-family: sans-serif;
            }

            a {
                text-decoration: none;
                color: black;
                margin-left: 1em;
            }

            a:hover {
                text-decoration: underline;
            }

            a img.icon {
                display: inline-block;
                height: 1em;
                margin: 0 0 -0.1em 0.3em;
            }

            @keyframes rotate {
                0% {
                    transform: scale(1) rotate(0deg);
                }

                100% {
                    transform: scale(1.5) rotate(360deg);
                }
            }

            .out-top {
                animation: rotate 20s ease-in-out infinite alternate;
                transform-origin: 13px 25px;
            }

            .in-top {
                animation: rotate 10s ease-in-out infinite alternate;
                transform-origin: 13px 25px;
            }

            .out-bottom {
                animation: rotate 25s ease-in-out infinite alternate;
                transform-origin: 84px 93px;
            }

            .in-bottom {
                animation: rotate 15s ease-in-out infinite alternate;
                transform-origin: 84px 93px;
            }

            @keyframes rotateOnly {
                0% {
                    transform: rotate(0deg);
                }

                100% {
                    transform: rotate(360deg);
                }
            }


            .out-mid {
                animation: rotate 18s linear infinite alternate, rotateOnly 18s linear infinite;
                transform-origin: 50px 50px;
            }

            .mid-1 {
                animation: rotate 12s linear infinite alternate, rotateOnly 12s linear infinite;
                transform-origin: 84px 93px;
            }

            .mid-2 {
                animation: rotate 14s linear infinite alternate, rotateOnly 14s linear infinite;
                transform-origin: 84px 93px;
            }

            .mid-3 {
                animation: rotate 16s linear infinite alternate, rotateOnly 16s linear infinite;
                transform-origin: 84px 93px;
            }

            .mid-4 {
                animation: rotate 11s linear infinite alternate, rotateOnly 11s linear infinite;
                transform-origin: 84px 93px;
            }

            .top-mid-1 {
                animation: rotate 18s linear infinite alternate, rotateOnly 18s linear infinite;
                transform-origin: 13px 25px;
            }

            .top-mid-2 {
                animation: rotate 16s linear infinite alternate, rotateOnly 16s linear infinite;
                transform-origin: 13px 25px;
            }

            .top-mid-3 {
                animation: rotate 14s linear infinite alternate, rotateOnly 14s linear infinite;
                transform-origin: 13px 25px;
            }

            .top-mid-4 {
                animation: rotate 12s linear infinite alternate, rotateOnly 12s linear infinite;
                transform-origin: 13px 25px;
            }

            .top-mid-5 {
                animation: rotate 11s linear infinite alternate, rotateOnly 11s linear infinite;
                transform-origin: 13px 25px;
            }

            .top-mid-6 {
                animation: rotate 9s linear infinite alternate, rotateOnly 9s linear infinite;
                transform-origin: 13px 25px;
            }
        </style>

        <!-- Sky gradient drifting through light grays -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <animate attributeName="x1" values="0;0.35;0;-0.35;0" dur="20s" repeatCount="indefinite" />
            <animate attributeName="y1" values="0;0.12;0;0.12;0" dur="20s" repeatCount="indefinite" />
            <animate attributeName="x2" values="0;-0.35;0;0.35;0" dur="20s" repeatCount="indefinite" />
            <animate attributeName="y2" values="1;0.88;1;0.88;1" dur="20s" repeatCount="indefinite" />

            <stop offset="0%" stop-color="#E2E4E2">
                <animate attributeName="stop-color" values="#E2E4E2;#D1D4D1;#C2C6C2;#D1D4D1;#E2E4E2" dur="16s"
                    repeatCount="indefinite" />
            </stop>
            <stop offset="100%" stop-color="#C2C6C2">
                <animate attributeName="stop-color" values="#C2C6C2;#E2E4E2;#D1D4D1;#E2E4E2;#C2C6C2" dur="16s"
                    repeatCount="indefinite" />
            </stop>
        </linearGradient>
    </defs>

    <!-- Brand-color sky background -->
    <rect x="10" y="10" width="80" height="80" fill="url(#skyGrad)" />

    <!-- Top-left corner: three largest shapes, order blue / red / green -->
    <!-- Blue -->
    <path fill="#2A398D" class="out-top"
        d="M37-5C25.1-14.7,5.7-19.1-9.2-10-28.5,1.8-32.7,31.1-19.8,49c15.5,21.5,52.6,22,67.2,2.3C59.4,35,53.7,8.5,37-5Z" />

    <!-- Red -->
    <path fill="#E61D25" class="in-top"
        d="M36,0c-11.5-7.5-28-4.5-38,1.5-16.5,10.5-20.5,34-8,50.5s33.5,12,45.5-7.5C45,32,44,12,36,0Z" />

    <!-- Green -->
    <path fill="#3CAC3B" class="top-mid-1"
        d="M35,6c-9-6-21.5-3.5-30,2-14,9-17.5,30-5,43s28.5,10,37.5-8.5C40,30,40,14,35,6Z" />

    <!-- Bottom-right corner: three largest shapes, order blue / green / red -->
    <!-- Blue -->
    <path fill="#2A398D" class="out-bottom"
        d="M105.9,48.6c-12.4-8.2-29.3-4.8-39.4.8-23.4,12.8-37.7,51.9-19.1,74.1s63.9,15.3,76-5.6c7.6-13.3,1.8-31.1-2.3-43.8C117.6,63.3,114.7,54.3,105.9,48.6Z" />

    <!-- Green -->
    <path fill="#3CAC3B" class="in-bottom"
        d="M 104 55 c -12.2 -8 -28 -5 -38 0.5 c -18.5 12.5 -24 39 -9 58.5 s 40.5 15 52.5 -8.5 C 120 80 115.5 66 104 55 Z" />

    <!-- Red -->
    <path fill="#E61D25" class="mid-1"
        d="M103,60c-10.5-7-23.5-4-32,2-15,10.5-19,34-7,50.5s33.5,12,45.5-7.5C114,98,113,70,103,60Z" />

    <!-- Official World Cup 26 logo, centered over the shapes -->
    <image href="WC26_Logo.avif" x="37.4" y="37.4" width="25.2" height="25.2"
        preserveAspectRatio="xMidYMid meet" />
    <!-- Official World Cup 26 logo, centered over the shapes -->
    <image href="WC26_Logo.avif" x="37.4" y="37.4" width="25.2" height="25.2"
        preserveAspectRatio="xMidYMid meet" />
</svg>
