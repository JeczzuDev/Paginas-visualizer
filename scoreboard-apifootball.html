            // otherwise an outage is indistinguishable from "nothing on today".
            if (d && d.error) throw new Error(d.error);
            if (d && d.diag && d.diag.leaguesOk === 0) throw new Error('relay reached ESPN on 0/' + d.diag.leaguesTotal + ' leagues — open ' + CONFIG.RELAY_URL + '/debug');
            return d;
        }
        function relayStatusShort(ev) {
            if (ev.statusType === 'finished') return 'FT';
            if (ev.statusType === 'notstarted') return 'NS';
            if ((ev.statusDesc || '').toLowerCase().includes('halftime')) return 'HT';
            return 'LIVE';
        }
        function normalizeRelay(ev) {
            return {
                idEvent: ev.id,
                relayId: ev.id,
                strHomeTeam: ev.home, strAwayTeam: ev.away,
                homeAbbr: ev.homeAbbr, awayAbbr: ev.awayAbbr,
                strHomeTeamBadge: ev.homeCrest || '',
                strAwayTeamBadge: ev.awayCrest || '',
                intHomeScore: ev.a, intAwayScore: ev.b,
                soA: ev.soA, soB: ev.soB,
                strLeague: ev.league, country: ev.country || '',
                dateEvent: ev.startTs ? new Date(ev.startTs * 1000).toISOString().slice(0, 10) : '',
                minute: ev.minute,
                statusShort: relayStatusShort(ev),
                _provider: 'live'
            };
        }

        /* ---- (D) ESPN direct from the browser — the DEFAULT live source.
               ESPN answers with Access-Control-Allow-Origin:* and a real browser
               is not caught by the Akamai bot filter that 403s the Cloudflare
               Worker, so no relay is needed. These functions emit exactly the
               same slim shape worker.js does, so normalizeRelay and everything
               downstream stay unchanged. ---- */
        const ESPN_BASE = 'https://site.api.espn.com/apis/site/v2/sports/soccer';
        const ESPN_LEAGUES = [
            'conmebol.libertadores', 'conmebol.sudamericana', 'conmebol.america',
            'chi.1', 'chi.2', 'chi.super_cup', 'chi.copa_chi',
        ];

        async function espnGet(path) {
            const r = await fetch(ESPN_BASE + path);
            if (!r.ok) throw new Error('espn ' + r.status);
            return r.json();
        }

        // status.clock caps at regular time, so added minutes come from
        // displayClock ("90'+7'"). Scheduled matches have no clock.
        function espnMinute(st) {
            const t = st.type || {};
            if (t.state !== 'in' && t.state !== 'post') return null;
            if ((t.description || '').toLowerCase().includes('halftime')) return 45;
            const m = /(\d+)'(?:\s*\+\s*(\d+))?/.exec(st.displayClock || '');
            if (!m) return null;
            return parseInt(m[1], 10) + (m[2] ? parseInt(m[2], 10) : 0);
        }

        function espnScore(s) { const n = parseInt(s, 10); return Number.isFinite(n) ? n : null; }

        function espnSlim(e, leagueName, slug) {
            const c = (e.competitions && e.competitions[0]) || {};
            const cs = c.competitors || [];
            const h = cs.find(x => x.homeAway === 'home') || cs[0] || {};
            const a = cs.find(x => x.homeAway === 'away') || cs[1] || {};
            const st = e.status || {};
            const state = (st.type && st.type.state) || '';
            return {
                id: 'espn:' + slug + ':' + e.id,
                home: h.team && h.team.displayName, away: a.team && a.team.displayName,
                homeAbbr: h.team && h.team.abbreviation, awayAbbr: a.team && a.team.abbreviation,
                homeCrest: (h.team && h.team.logo) || '', awayCrest: (a.team && a.team.logo) || '',
                a: espnScore(h.score), b: espnScore(a.score),
                soA: espnScore(h.shootoutScore), soB: espnScore(a.shootoutScore),
                statusType: state === 'in' ? 'inprogress' : (state === 'post' ? 'finished' : 'notstarted'),
                statusDesc: (st.type && st.type.description) || '',
                detail: (st.type && st.type.shortDetail) || '',
                minute: espnMinute(st),
                league: leagueName || slug, country: '',
                startTs: e.date ? Math.floor(Date.parse(e.date) / 1000) : null
            };
        }

        // Fan out over the league list. A single failing league is tolerated, but
        // an all-fail is thrown — never reported as "no matches" (that ambiguity
        // is exactly what made the relay outage impossible to diagnose).
        async function espnAll(ymd) {
            const results = await Promise.all(ESPN_LEAGUES.map(async slug => {
                try {
                    const d = await espnGet(`/${slug}/scoreboard${ymd ? '?dates=' + ymd : ''}`);
                    const name = (d.leagues && d.leagues[0] && d.leagues[0].name) || slug;
                    return (d.events || []).map(e => espnSlim(e, name, slug));
                } catch (e) { return null; }
            }));
            const ok = results.filter(Boolean);
            if (!ok.length) throw new Error(`ESPN unreachable — all ${ESPN_LEAGUES.length} leagues failed`);
            return ok.flat();
        }

        const ymdOf = (date) => (date || '').replace(/-/g, '');

        async function espnLive() { return (await espnAll()).filter(e => e.statusType === 'inprogress'); }
        async function espnDay(date) { return espnAll(ymdOf(date)); }

        async function espnMatch(id, date) {
            const p = (id || '').split(':');           // ['espn', slug, eventId]
            if (p[0] !== 'espn' || !p[1] || !p[2]) return null;
            const find = async (ymd) => {
                try {
                    const d = await espnGet(`/${p[1]}/scoreboard${ymd ? '?dates=' + ymd : ''}`);
                    const name = (d.leagues && d.leagues[0] && d.leagues[0].name) || p[1];
                    return (d.events || []).map(e => espnSlim(e, name, p[1])).find(e => e.id === id) || null;
                } catch (e) { return null; }
            };
            // Try the match's own date first, then the league's default window.
            // Both are needed: the default window only spans the current
            // matchday, while dateEvent is a UTC date and ESPN buckets its
            // ?dates= by US Eastern — so a late kickoff can sit on either side.
            for (const w of (date ? [ymdOf(date), null] : [null])) {
                const ev = await find(w);
                if (ev) return ev;
            }
            return null;
        }

        async function espnShots(id) {
            const p = (id || '').split(':');
            if (p[0] !== 'espn' || !p[1] || !p[2]) return { home: [], away: [] };
            const sum = await espnGet(`/${p[1]}/summary?event=${p[2]}`);
            const arr = Array.isArray(sum.shootout) ? sum.shootout : [];
            const cs = (sum.header && sum.header.competitions && sum.header.competitions[0] && sum.header.competitions[0].competitors) || [];
            const nameOf = side => { const c = cs.find(x => x.homeAway === side); return (c && c.team && c.team.displayName) || ''; };
            const seqOf = name => { const t = arr.find(x => (x.team || '').toLowerCase() === name.toLowerCase()); return t ? (t.shots || []).map(s => !!s.didScore) : []; };
            let home = seqOf(nameOf('home')), away = seqOf(nameOf('away'));
            if (!home.length && !away.length && arr.length === 2) {
                home = (arr[0].shots || []).map(s => !!s.didScore);
                away = (arr[1].shots || []).map(s => !!s.didScore);
            }
            return { home, away };
        }

        /* ---- live-source abstraction. Both sources yield the same slim events,
               so they are interchangeable. Order of preference: an explicitly
               configured relay first, then ESPN direct — a relay that ESPN has
               started blocking must not take the page down when the browser can
               still reach ESPN itself. ---- */
        function relaySource() {
            return {
                label: 'relay',
                live: async () => (await relayGet('/live')).events || [],
                day: async (d) => (await relayGet('/day?date=' + d)).events || [],
                match: async (id, d) => (await relayGet('/match?id=' + encodeURIComponent(id) + (d ? '&date=' + d : ''))).event || null,
                shots: async (id) => await relayGet('/shots?id=' + encodeURIComponent(id))
            };
        }
        function espnSource() {
            return { label: 'ESPN', live: espnLive, day: espnDay, match: espnMatch, shots: espnShots };
        }
        function liveSources() { return relayReady() ? [relaySource(), espnSource()] : [espnSource()]; }

        // Run one live-source operation, walking the preference list on failure.
        async function fromLive(op, label) {
            const errs = [];
            for (const src of liveSources()) {
                try {
                    const evs = await op(src);
                    populateEvents(evs.map(normalizeRelay), label + (src.label === 'ESPN' ? '' : ' (via relay)'));
                    return true;
                } catch (e) { errs.push(`${src.label}: ${e.message || e}`); }
            }
            apiStatus('Live source failed — ' + errs.join(' · '), 'err');
            return false;
        }

        async function liveMatch(id, date) {
            for (const src of liveSources()) {
                try { const ev = await src.match(id, date); if (ev) return ev; } catch (e) { /* try next */ }
            }
            return null;
        }
        async function liveShots(id) {
            for (const src of liveSources()) {
                try { return await src.shots(id); } catch (e) { /* try next */ }
            }
            return { home: [], away: [] };
        }

        // Auto-poll the selected match (no API cap on either live source).
        function startLivePoll() {
            stopLivePoll();
            if (!selectedEvent || selectedEvent._provider !== 'live') return;
            if (selectedEvent.statusShort === 'FT') return;   // finished — clock already frozen, no need to poll
            livePollTimer = setInterval(relayTick, CONFIG.RELAY_POLL_MS);
            relayTick();   // fire now: setInterval alone leaves the board stale for a whole interval
        }
        function stopLivePoll() { if (livePollTimer) { clearInterval(livePollTimer); livePollTimer = null; } }
        async function relayTick() {
            if (!selectedEvent || selectedEvent._provider !== 'live') { stopLivePoll(); return; }
            try {
                const raw = await liveMatch(selectedEvent.relayId, selectedEvent.dateEvent);
                const ev = raw ? normalizeRelay(raw) : null;
                if (!ev) { apiStatus(`Live update: match not found upstream (${stamp()}) — still retrying.`, 'err'); return; }
                state.scoreA = toScore(ev.intHomeScore);
                state.scoreB = toScore(ev.intAwayScore);
                applyClockFromMinute(ev);
                saveState(); syncControlsFromState();
                if (state.pens && state.pens.show) loadShots();
                if (ev.statusShort === 'FT') { apiStatus('Match finished — live updates stopped.', 'ok'); stopLivePoll(); return; }
                const when = ev.minute != null ? ev.minute + "'" : (ev.statusShort || '');
                apiStatus(`● LIVE ${state.scoreA}-${state.scoreB} · ${when} · updated ${stamp()}`, 'ok');
            } catch (e) {
                // Never fail silently: an operator must be able to see the feed died.
                apiStatus(`Live update failed (${stamp()}): ${e.message || e} — retrying in ${Math.round(CONFIG.RELAY_POLL_MS / 1000)}s.`, 'err');
            }
        }

        function stamp() { return new Date().toLocaleTimeString(); }

        // Fetch the shootout kick sequence (made/missed per team).
        async function loadShots() {
            if (!selectedEvent || selectedEvent._provider !== 'live') return;
            try {
                const d = await liveShots(selectedEvent.relayId);
                if (state.pens) { state.pens.home = d.home || []; state.pens.away = d.away || []; saveState(); }
            } catch (e) { /* transient */ }
        }

        async function loadLive() {
            apiStatus('Loading live matches…');
            if (await fromLive(src => src.live(), '(live now)')) return;
            if (!requireKey()) return;
            apiStatus('Loading live matches (API-Football)…');
            try {
                if (overQuota()) throw new Error('Daily request limit reached');
                const data = await apiGet('/fixtures?live=all');
                populateEvents((data.response || []).map(normalize), '(live now)');
            } catch (e) {
                if (!CONFIG.FALLBACK) { apiStatus('API error: ' + e.message, 'err'); return; }
                apiStatus('API-Football unavailable — TheSportsDB has no live feed; loading today’s fixtures…');
                try { populateEvents(await tsdbDay(todayStr()), '(today, via TheSportsDB)'); }
                catch (e2) { apiStatus('Both sources failed: ' + (e2.message || e2), 'err'); }
            }
        }

        async function loadByDate() {
            const date = $('[data-api-date]').value;
            if (!date) { apiStatus('Pick a date first.', 'err'); return; }
            apiStatus('Loading day’s matches…');
            if (await fromLive(src => src.day(date), `for ${date}`)) return;
            if (!requireKey()) return;
            apiStatus('Loading day’s matches (API-Football)…');
            try {
                if (overQuota()) throw new Error('Daily request limit reached');
                const data = await apiGet(`/fixtures?date=${date}`);
                populateEvents((data.response || []).map(normalize), `for ${date}`);
            } catch (e) {
                await runFallback(() => tsdbDay(date), `for ${date}`, e);
            }
        }

        async function loadByTeam() {
            const name = ($('[data-api-team]').value || '').trim();
            if (!name) { apiStatus('Type a team name first.', 'err'); return; }
            apiStatus('Loading today’s matches to filter…');
            if (await fromLive(src => src.day(todayStr()), `for ${todayStr()}`)) {
                const s = $('[data-match-search]'); if (s) { s.value = name; renderMatchList(); }
                return;
            }
            if (!requireKey()) return;
            apiStatus('Searching team (API-Football)…');
            try {
                if (overQuota()) throw new Error('Daily request limit reached');
                const tData = await apiGet(`/teams?search=${encodeURIComponent(name)}`);
                const team = tData.response && tData.response[0] && tData.response[0].team;
                if (!team) { apiStatus(`No team matched "${name}".`, 'err'); return; }
                apiStatus(`Found ${team.name}. Loading fixtures…`);
                const [last, next] = await Promise.all([
                    apiGet(`/fixtures?team=${team.id}&last=10`).catch(() => ({})),
                    apiGet(`/fixtures?team=${team.id}&next=10`).catch(() => ({}))
                ]);
                const events = [].concat(last.response || [], next.response || []).map(normalize);
                populateEvents(events, `for ${team.name}`);
            } catch (e) {
                await runFallback(() => tsdbTeam(name), `for "${name}"`, e);
            }
        }

        function applySelectedApiMatch() {
            if (!selectedEvent) { apiStatus('Pick a match from the list first.', 'err'); return; }
            fillFromEvent(selectedEvent);
            state.source = 'api:' + (selectedEvent.idEvent || '');
            saveState();
            syncControlsFromState();
            apiStatus('Filled from API. Enable auto-refresh to keep score + minute in sync, or edit manually.', 'ok');
        }

        function fillFromEvent(ev) {
            if (ev.strHomeTeam) { state.teamA.name = ev.strHomeTeam; state.teamA.abbr = ev.homeAbbr || abbrOf(ev.strHomeTeam); }
            if (ev.strAwayTeam) { state.teamB.name = ev.strAwayTeam; state.teamB.abbr = ev.awayAbbr || abbrOf(ev.strAwayTeam); }
            if (ev.strHomeTeamBadge) state.teamA.badge = ev.strHomeTeamBadge;
            if (ev.strAwayTeamBadge) state.teamB.badge = ev.strAwayTeamBadge;
            state.scoreA = toScore(ev.intHomeScore);
            state.scoreB = toScore(ev.intAwayScore);
            applyClockFromMinute(ev);
        }

        // API-Football exposes the live elapsed minute — seed the clock from it.
        function applyClockFromMinute(ev) {
            applyPens(ev);
            const s = (ev.statusShort || '').toUpperCase();
            // Freeze the clock during a shootout (show the end-of-ET value, e.g. 120:00).
            const inPlay = ['1H', '2H', 'ET', 'LIVE', 'P'].includes(s) && !(state.pens && state.pens.show);
            if (Number.isFinite(ev.minute)) {
                state.clock.base = ev.minute * 60;
                state.clock.since = Date.now();
                state.clock.running = inPlay;
            }
            if (s === 'NS') return;   // upcoming match — don't force a live status
            state.status = mapStatus(ev);
        }

        // Penalty shootout: ESPN keeps the regular score and exposes the live
        // shootout count in soA/soB while status is "Shootout" / "AET-pens".
        function applyPens(ev) {
            if (Number.isFinite(ev.soA) && Number.isFinite(ev.soB)) {
                const prev = (state.pens && state.pens.show) ? state.pens : {};
                state.pens = { show: true, auto: true, a: ev.soA, b: ev.soB, home: prev.home || [], away: prev.away || [] };
            } else if (state.pens && state.pens.auto) {
                // Only clear a shootout this feed put there — polling every 15s must
                // never wipe one the operator switched on manually.
                state.pens = { show: false, auto: false, a: 0, b: 0, home: [], away: [] };
            }
        }

        function toScore(v) {
            const n = parseInt(v, 10);
            return Number.isFinite(n) ? n : 0;
        }

        async function refreshScore() {
            if (!selectedEvent || !selectedEvent.idEvent) return false;
            let ev;
            if (selectedEvent._provider === 'live') {
                const raw = await liveMatch(selectedEvent.relayId, selectedEvent.dateEvent);
                ev = raw ? normalizeRelay(raw) : null;
            } else if (selectedEvent._provider === 'tsdb') {
                ev = await tsdbRefresh(selectedEvent.tsdbId);
            } else if (overQuota() && CONFIG.FALLBACK) {
                throw new Error('Daily limit reached — re-load this match (Live/Day/Find) so it comes from TheSportsDB, then Refresh.');
            } else {
                const data = await apiGet(`/fixtures?id=${selectedEvent.idEvent}`);
                const f = data.response && data.response[0];
                ev = f ? normalize(f) : null;
            }
            if (!ev) return false;
            state.scoreA = toScore(ev.intHomeScore);
            state.scoreB = toScore(ev.intAwayScore);
            applyClockFromMinute(ev);
            saveState(); syncControlsFromState();
            return true;
        }

        // Manual one-shot refresh (no polling — avoids silently draining the quota).
        async function manualRefresh() {
            if (!selectedEvent || !selectedEvent.idEvent) { apiStatus('Pick a match first, then Refresh.', 'err'); return; }
            apiStatus('Refreshing…');
            try {
                const ok = await refreshScore();
                apiStatus(ok ? 'Score refreshed from API.' : 'No data returned for this match.', ok ? 'ok' : 'err');
            } catch (e) {
                apiStatus('Refresh error: ' + e.message, 'err');
            }
        }

        // Manually fetch the latest penalty kicks from the relay.
        async function refreshPenalties() {
            if (!selectedEvent || selectedEvent._provider !== 'live') { apiStatus('Load a live match first.', 'err'); return; }
            apiStatus('Fetching penalty kicks…');
            try {
                await loadShots();
                if (state.pens) {
                    state.pens.show = true;
                    saveState();
                    syncControlsFromState();
                }
                apiStatus('Penalty kicks updated.', 'ok');
            } catch (e) {
                apiStatus('Penalties error: ' + e.message, 'err');
            }
        }

        // Map API-Football status short code -> our status label.
        function mapStatus(ev) {
            const s = (ev.statusShort || '').toUpperCase();
            if (s === 'HT') return 'HT';
            if (['FT', 'AET', 'PEN'].includes(s)) return 'FT';
            if (['1H', '2H', 'ET', 'LIVE', 'P', 'NS'].includes(s)) return 'LIVE';
            return ev.statusShort || 'LIVE';
        }

        // Last: resumeLivePoll assigns `selectedEvent` / `livePollTimer`, which are
        // `let` bindings declared above — it must run after they initialise, so this
        // stays at the very bottom of the script rather than inside initControl().
        resumeLivePoll();
    </script>
</body>

</html>
