<!--
- FIFA World Cup 26 transition for OBS Browser Transition plugin
- Shapes grow in from their corner, then slide out toward the OPPOSITE corner
- No opacity fades and no rotation — only scale growth + diagonal slide-out
- Total cycle: ~3.2s (longest animation)
- Use this time in OBS Browser Transition plugin settings
-->

<svg preserveAspectRatio="xMidYMid slice" viewBox="10 10 80 80" style="background: transparent;">

        <style>
            * {
                box-sizing: border-box;
                padding: 0;
                margin: 0;
            }

            svg {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                transform: scaleX(-1);
            }

            /* Initial state: shapes are hidden (scaled to 0) before animation starts */
            path {
                transform: scale(0);
            }

            /*
             * Exit direction: top-group shapes grow in at the top-left corner
             * and slide out toward the bottom-right (+x, +y); bottom-group shapes
             * grow in at the bottom-right corner and slide out toward the

             * shrinks at the far corner. No rotation.

            @keyframes grow-top-out {
                0%   { transform: translate(0, 0) scale(0) rotate(0deg); }
